info:
  name: "6주차 RESTful: 검색 조건도 같은 컬렉션 조회 API로 처리"
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:18080/api/boards?title=Cursor&writer=donghun
  params:
    - name: title
      value: Cursor
      type: query
    - name: writer
      value: donghun
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
